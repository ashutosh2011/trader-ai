# Cloud-agnostic VM deployment for tradebot.
# Works on any SSH-reachable Linux VM (GCP, AWS, Linode, Hetzner, DigitalOcean, …).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy --strict .

      - name: Pytest
        run: pytest -q

  build:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_PATH: /opt/tradebot
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/*"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_HASH: ${{ secrets.BASIC_AUTH_HASH }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,DEPLOY_DOMAIN,BASIC_AUTH_USER,BASIC_AUTH_HASH,KITE_API_KEY,KITE_API_SECRET,KITE_ACCESS_TOKEN,GOOGLE_API_KEY,OPENAI_API_KEY,ANTHROPIC_API_KEY
          script: |
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"

            if [[ ! -f config/config.yaml ]]; then
              cp config.docker.yaml config/config.yaml
            fi

            if [[ ! -f .env ]]; then
              cp env.example .env
            fi

            upsert_env() {
              local key="$1"
              local value="$2"
              if [[ -z "${value}" ]]; then
                return 0
              fi
              # Docker Compose treats $ as variable refs in .env — escape for bcrypt hashes.
              local escaped="${value//$/$$}"
              touch .env
              grep -v "^${key}=" .env > .env.tmp || true
              printf '%s=%s\n' "${key}" "${escaped}" >> .env.tmp
              mv .env.tmp .env
            }

            upsert_env IMAGE "${IMAGE}"
            upsert_env APP_UID "$(id -u)"
            upsert_env APP_GID "$(id -g)"
            upsert_env DEPLOY_DOMAIN "${DEPLOY_DOMAIN}"
            upsert_env BASIC_AUTH_USER "${BASIC_AUTH_USER}"
            upsert_env BASIC_AUTH_HASH "${BASIC_AUTH_HASH}"
            upsert_env KITE_API_KEY "${KITE_API_KEY}"
            upsert_env KITE_API_SECRET "${KITE_API_SECRET}"
            upsert_env KITE_ACCESS_TOKEN "${KITE_ACCESS_TOKEN}"
            upsert_env GOOGLE_API_KEY "${GOOGLE_API_KEY}"
            upsert_env OPENAI_API_KEY "${OPENAI_API_KEY}"
            upsert_env ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker compose pull
            docker compose up -d
            docker compose ps

            docker compose exec -T dashboard curl -sf http://127.0.0.1:8765/ >/dev/null
            echo "Dashboard health check passed"

      - name: Public HTTPS smoke check
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            curl -sf -u "${{ secrets.BASIC_AUTH_USER }}:${{ secrets.BASIC_AUTH_PASSWORD }}" \
              "https://${{ secrets.DEPLOY_DOMAIN }}/" >/dev/null
            echo "Public HTTPS health check passed"
