# Docker deployment config — copy to config/config.yaml on the VM.
# Paths point at persistent /app/runtime and /app/logs mounts.

risk:
  max_loss_per_trade_pct: 0.5
  daily_loss_cap_pct: 2.0
  max_open_positions: 3
  position_sizing: atr_based
  fixed_position_pct: 1.0
  no_trade_windows:
    - "09:15-09:30"
    - "15:15-15:30"
  expiry_day_rules:
    block_new_options_entries_after: "14:30"

paper:
  slippage_bps: 5.0
  account_equity: 100000.0

kite:
  api_key:
  api_secret:
  access_token:

data:
  duckdb_path: runtime/candles.duckdb
  default_timeframe: 5minute

scheduler:
  market_open: "09:15"
  market_close: "15:30"
  holiday_skip_dates: []
  expiry_weekday: 3
  block_fno_on_expiry_after: "14:30"

analyst:
  default_provider: google
  model_anthropic: claude-3-5-haiku-latest
  model_openai: gpt-4o-mini
  model_google: gemini-3.5-flash

live_default_qty: 1

# Persistent runtime state (bind-mounted at /app/runtime on the VM).
kill_switch_file: runtime/KILL
state_db_path: runtime/order_state.duckdb
